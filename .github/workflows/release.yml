name: Release

on:
  push:
    tags: ["*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: i686-unknown-linux-gnu

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # glibc 2.36 = debian 12 and anything newer, good enough for most servers
      - name: Build
        run: cargo zigbuild --release -p auxcpu-byondapi --target i686-unknown-linux-gnu.2.36

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: target/i686-unknown-linux-gnu/release/libauxcpu_byondapi.so

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: i686-pc-windows-msvc

      - name: Build
        run: cargo build --release -p auxcpu-byondapi --target i686-pc-windows-msvc

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/i686-pc-windows-msvc/release/auxcpu_byondapi.dll
            target/i686-pc-windows-msvc/release/auxcpu_byondapi.pdb
